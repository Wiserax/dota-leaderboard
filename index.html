  :root {
    /* surfaces */
    --bg: #0c0f14;
    --panel: #141a22;
    --panel-2: #161c25;
    --row: #12171f;
    --row-alt: #0f131a;
    --row-hover: #1d242e;
    --line: #232b36;
    /* ink */
    --ink: #eaeff6;
    --steel: #9aa8ba;
    --dim: #8093a8;
    /* accents */
    --ember: #c8402f;
    --ember-hi: #e05a41;
    --ember-deep: #8f2a1e;
    --up: #6ec888;
    --down: #f2766b;
    --gold: #e6b45c;
    --ring: #ecc069;
    /* type */
    --display: "Oswald", "Arial Narrow", Arial, sans-serif;
    --body: "Inter", "Segoe UI", Tahoma, sans-serif;
    /* линия горизонта — датум вайпа */
    --horizon: linear-gradient(90deg,
      transparent 0%, rgba(200, 64, 47, .45) 12%,
      #e05a41 50%,
      rgba(200, 64, 47, .45) 88%, transparent 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { overflow-x: clip; }

    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  body {
    background:
      radial-gradient(1100px 420px at 50% -60px, rgba(200, 64, 47, .06), transparent 70%),

    color: var(--ink);

  ::selection { background: var(--ember-deep); color: #fff; }

  .wrap { max-width: 1264px; margin: 0 auto; padding: 0 16px; }

  /* ── two-column layout: board + side panel ──────────── */
  .layout {
    display: grid; grid-template-columns: minmax(0, 1fr) 280px;
    gap: 24px; align-items: start;
  }
  .side { display: grid; gap: 16px; position: sticky; top: 16px; }
  .side-card {
    background: #10161e; border: 1px solid #1c232d;
    border-radius: 10px; padding: 16px;

  .side-title {
    font: 500 14px/1.2 var(--display); text-transform: uppercase;
    letter-spacing: .12em; color: var(--ink);

  .side-title .hl { color: var(--ember-hi); }
  .side-sub { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .hg-list { margin-top: 10px; }
  .hg-row {
    appearance: none; background: none; border: 0; width: 100%;
    font: inherit; color: inherit; text-align: left;
    display: flex; align-items: center; gap: 8px;
    padding: 9px 0; font-size: 13px; cursor: pointer;
  }
  .hg-row + .hg-row { border-top: 1px solid var(--line); }
  .hg-rank {
    color: var(--steel); font: 500 14px/1 var(--display);
    min-width: 44px; font-variant-numeric: tabular-nums;
  }
  .hg-name {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-weight: 500;
  }
  .hg-delta { color: var(--up); font-weight: 700; font-variant-numeric: tabular-nums; }
  .hg-empty { color: var(--dim); font-size: 12px; padding: 8px 0; }
  .side-sum {
    display: flex; align-items: center; justify-content: space-between;
    list-style: none; cursor: default;
  }
  .side-sum::-webkit-details-marker { display: none; }
  .acc-arrow { display: none; color: var(--steel); font-size: 12px; transition: transform .15s ease; }
  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; gap: 16px; }
    .side { /* гриндеры уходят ПОД таблицу: между фильтрами и данными ничего не стоит */
      position: static; order: 1;
      display: grid; grid-template-columns: 1fr; gap: 8px;
    }
    .side-sum { cursor: pointer; }
    .acc-arrow { display: inline; }
    .side-card[open] .acc-arrow { transform: rotate(180deg); }
    /* до готовности JS держим аккордеоны свёрнутыми, чтобы не мигали раскрытыми */
    body:not(.acc-ready) .side-card > :not(summary) { display: none; }
  }

  /* ── topbar ─────────────────────────────────────────── */
  .topbar {
    background: linear-gradient(180deg, #271012 0%, #14090a 100%);

  .topbar .wrap {

  .logo {

  .topnav { display: flex; gap: 4px; margin-left: auto; margin-right: 12px; }
  .topnav a {
    font: 500 12px/1 var(--display); text-transform: uppercase; letter-spacing: .12em;

    border-radius: 4px; transition: color .12s ease, background-color .12s ease;
  }
  .topnav a:hover { color: var(--ink); background: rgba(255, 255, 255, .06); }
  #board, #grinders { scroll-margin-top: 16px; }
  @media (prefers-reduced-motion: no-preference) {

  /* language switcher */
  .lang {
    display: flex; gap: 2px; padding: 2px;

  }
  .lang-btn {
    appearance: none; border: 0; background: transparent;

    transition: color .12s ease, background-color .12s ease;

  .lang-btn:hover { color: var(--ink); background: rgba(255,255,255,.06); }
  .lang-btn.active { background: var(--ember-deep); color: #fff; }
  .lang-btn.active:hover { background: #a03325; }
  .lang-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }

  /* ── site hero ──────────────────────────────────────── */
  .hero { padding: 52px 16px 4px; text-align: center; position: relative; }
  .hero::after { /* угольки, поднимающиеся с линии горизонта */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-repeat: no-repeat;
    background-image:
      radial-gradient(2px 2px at 6% 88%, rgba(224, 90, 65, .40) 0 45%, transparent 50%),
      radial-gradient(1.5px 1.5px at 12% 55%, rgba(224, 90, 65, .22) 0 45%, transparent 50%),
      radial-gradient(2px 2px at 18% 74%, rgba(224, 90, 65, .30) 0 45%, transparent 50%),

      radial-gradient(2.5px 2.5px at 34% 80%, rgba(224, 90, 65, .45) 0 45%, transparent 50%),
      radial-gradient(1.5px 1.5px at 43% 60%, rgba(224, 90, 65, .20) 0 45%, transparent 50%),
      radial-gradient(2px 2px at 57% 68%, rgba(224, 90, 65, .35) 0 45%, transparent 50%),
      radial-gradient(1.5px 1.5px at 66% 42%, rgba(224, 90, 65, .18) 0 45%, transparent 50%),
      radial-gradient(2px 2px at 74% 84%, rgba(224, 90, 65, .40) 0 45%, transparent 50%),
      radial-gradient(1.5px 1.5px at 82% 58%, rgba(224, 90, 65, .22) 0 45%, transparent 50%),
      radial-gradient(2px 2px at 90% 76%, rgba(224, 90, 65, .32) 0 45%, transparent 50%),
      radial-gradient(1px 1px at 96% 46%, rgba(224, 90, 65, .15) 0 45%, transparent 50%);
    animation: ember-drift 16s ease-in-out infinite alternate;
  }
  @keyframes ember-drift {
    from { transform: translate(-7px, 4px); }
    to { transform: translate(7px, -10px); }
  }
  .hero-title {
    font: 600 clamp(44px, 9vw, 92px)/1 var(--display);
    text-transform: uppercase; letter-spacing: .02em; color: #f2efec;
    filter: drop-shadow(0 0 34px rgba(224, 90, 65, .30));
  }
  .hero-title .fall {
    background: linear-gradient(180deg, #ff8a66 0%, var(--ember-hi) 45%, var(--ember-deep) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: fall-glow 3.6s ease-in-out infinite alternate;
  }
  @keyframes fall-glow {
    from { filter: drop-shadow(0 0 10px rgba(224, 90, 65, .16)); }
    to { filter: drop-shadow(0 0 30px rgba(224, 90, 65, .48)); }
  }
  .hero-sub { color: var(--steel); margin-top: 12px; font-size: 14px; letter-spacing: .02em; }
  .hero-epigraph {
    position: relative; max-width: 600px; margin: 20px auto 0;
    padding-top: 16px; color: var(--dim);
    font-size: 13px; line-height: 1.8; letter-spacing: .015em;
  }
  .hero-epigraph::before { /* тонкая линия-датум над эпиграфом */
    content: ""; position: absolute; top: 0; left: 50%;
    transform: translateX(-50%); width: 64px; height: 1px;
    background: var(--horizon); opacity: .8;
  }
  .hero-cta {
    display: inline-block; margin-top: 20px; padding: 11px 24px;
    font: 600 13px/1 var(--display); text-transform: uppercase; letter-spacing: .14em;
    color: var(--ink); text-decoration: none;
    border: 1px solid var(--ember); border-radius: 4px;
    background: rgba(200, 64, 47, .10);
    transition: background-color .15s ease, border-color .15s ease;
  }
  .hero-cta:hover { background: rgba(200, 64, 47, .22); border-color: var(--ember-hi); }

  /* ── digest: markers on the settling line ───────────── */
  .digest-band { padding: 4px 0 26px; }
  .digest-label {
    font: 500 11px/1 var(--display); letter-spacing: .22em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 14px;
  }
  .digest { position: relative; }
  .digest::before { /* линия горизонта — датум вайпа, во всю ширину */
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: var(--horizon);
  }
  .digest::after { /* отсвет над линией */
    content: ""; position: absolute; left: 0; right: 0; top: -44px; height: 44px;
    pointer-events: none;
    background: radial-gradient(60% 100% at 50% 100%, rgba(224, 90, 65, .08), transparent 70%);
  }
  .digest-track { display: flex; gap: 10px; padding-top: 20px; }
  .fact {
    position: relative; flex: 1 1 0; min-width: 0;
    background: linear-gradient(180deg, #151b24 0%, #10151c 100%);
    border: 1px solid var(--line); border-radius: 8px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .03);
    padding: 11px 14px 12px;
    transition: border-color .15s ease;
  }
  .fact::before { /* ножка: карточка подвешена к линии */
    content: ""; position: absolute; top: -20px; left: 16px;
    width: 2px; height: 20px; opacity: .75;
  }
  .fact::after { /* пин на самой линии */
    content: ""; position: absolute; top: -22px; left: 14.5px;
    width: 5px; height: 5px; border-radius: 50%; opacity: .9;
  }
  .fact--up::before, .fact--up::after { background: var(--up); }
  .fact--down::before, .fact--down::after { background: var(--down); }
  .fact--gold::before, .fact--gold::after { background: var(--gold); }
  .fact--steel::before, .fact--steel::after { background: var(--dim); }
  /* TOP 10 SURVIVORS — кровавая обводка */
  .fact--surv {
    border-color: var(--ember);
    background:
      linear-gradient(180deg, rgba(200, 64, 47, .16), rgba(200, 64, 47, .04) 60%),
      linear-gradient(180deg, #151b24 0%, #10151c 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 138, 102, .12),
      inset 0 0 22px rgba(200, 64, 47, .16),
      0 0 16px rgba(200, 64, 47, .20);
    animation: surv-pulse 2.8s ease-in-out infinite alternate;
  }
  @keyframes surv-pulse {
    from { box-shadow: inset 0 1px 0 rgba(255, 138, 102, .12), inset 0 0 22px rgba(200, 64, 47, .14), 0 0 12px rgba(200, 64, 47, .16); }
    to { box-shadow: inset 0 1px 0 rgba(255, 138, 102, .12), inset 0 0 26px rgba(200, 64, 47, .22), 0 0 24px rgba(200, 64, 47, .34); }
  }
  .fact--surv::before, .fact--surv::after { background: var(--ember-hi); }
  .fact--surv:hover { border-color: var(--ember-hi); }
  .fact--surv .fact-label { color: var(--ember-hi); font-weight: 800; letter-spacing: .1em; }
  .fact-label-sub {
    display: block; font: 500 9px/1.3 var(--body); letter-spacing: .04em;
    color: var(--dim); text-transform: none; margin-top: 2px;
  }
  .fact-delta--surv { color: #ff8a66; }
  .fact:hover { border-color: #34404f; }
  .fact:hover::before, .fact:hover::after { opacity: 1; }
  .fact-label {
    display: block; min-height: 26px;
    font: 700 10px/1.3 var(--body); text-transform: uppercase;
    letter-spacing: .08em; color: var(--steel); margin-bottom: 6px;
  }
  .fact-value {
    display: flex; align-items: baseline; gap: 8px; min-width: 0;
    font: 600 20px/1.15 var(--display); font-variant-numeric: tabular-nums;
  }
  .fact-nick {
    color: var(--ink); flex: 0 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .fact-nick--gold { color: var(--gold); }
  .fact-delta { flex: none; }
  .f-up { color: var(--up); }
  .f-down { color: var(--down); }
  .fact-delta--gold { color: var(--gold); }
  .fact-delta--steel { color: var(--ink); }
  .fact-of { font: 500 13px var(--display); color: var(--dim); text-transform: lowercase; }
  .fact-react { display: flex; gap: 2px; margin-top: 8px; }
  .re-btn {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    font-size: 13px; line-height: 1; padding: 3px 4px; border-radius: 4px;
    opacity: .38; filter: grayscale(35%);
    transition: opacity .12s ease, transform .12s ease, background-color .12s ease;
  }
  .re-btn:hover { opacity: 1; filter: none; transform: scale(1.18); background: rgba(255, 255, 255, .05); }
  .re-btn:active { transform: scale(1.32); }
  .re-btn.on { opacity: 1; filter: none; }
  .re-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
  .re-n {
    font: 600 10px/1 var(--body); color: var(--dim);
    margin-left: 3px; vertical-align: 1px; font-variant-numeric: tabular-nums;
  }
  .re-btn.on .re-n { color: var(--ember-hi); }
  @media (max-width: 1023px) {
    .digest-track {
      overflow-x: auto; scroll-snap-type: x proximity;
      gap: 8px; padding-bottom: 8px;
      scrollbar-width: thin; scrollbar-color: #232b36 transparent;

    .digest-track::-webkit-scrollbar { height: 6px; }

    .fact { flex: 0 0 200px; scroll-snap-align: start; }

  /* ── page header ────────────────────────────────────── */
  header.page { padding: 32px 0 0; position: relative; }
  .h1-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 {
    font: 600 clamp(22px, 3.5vw, 30px)/1.1 var(--display);
    text-transform: uppercase; letter-spacing: .04em;
    border-left: 3px solid var(--ember); padding-left: 16px;
  }
  .wipe-chip {
    font: 600 13px/1 var(--display); letter-spacing: .14em; text-transform: uppercase;
    color: var(--gold); border: 1px solid #64512a; border-radius: 4px;
    background: rgba(230, 180, 92, .08); padding: 8px 12px; white-space: nowrap;
  }
  .sub {
    color: var(--steel); margin: 8px 0 0 20px; font-size: 13px;
    font-variant-numeric: tabular-nums;
  }

  /* ── KPI tiles ──────────────────────────────────────── */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px; margin-top: 24px;
  }
  .kpi {
    appearance: none; font: inherit; text-align: left; color: inherit;
    cursor: pointer; display: block; width: 100%;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 16px;
  }
  .kpi.active {
    border-color: var(--line);
    background: linear-gradient(180deg, rgba(200, 64, 47, .10), transparent 55%), var(--panel);

  .d-up::before, .d-down::before, .kpi-value.up::before, .kpi-value.down::before,

  /* ── load animations & micro-interactions ───────────── */
  @keyframes rise {

  .hg-row:hover { background: rgba(255, 255, 255, .03); }
  .settled .hero-title, .settled .hero-sub, .settled .h1-row, .settled .sub,
  .settled .kpi, .settled .controls, .settled .count-note,

  .fb-overlay {

<script>
(function () {

    },

      thRank: "Rank", thChg: "Chg.", thPlayer: "Player",
      found: "Found: ", of: " of ", shownPart: " · showing ",

      dLeader: "Current leader", dOf: "of",
      dClimb: "Climb · since wipe", dClimb24: "Climb · last 24h · top 100",
      dFall: "Record fall", dFallStar: "Fall · notable players",
      dKept: "Starting top-10 still in top-10",
      epi: "On July 31, 2026, Valve reset the rating of the world's strongest players. Sixteen thousand MMR became nine and a half. In the days and weeks that followed, five thousand players across Europe began the climb again. This site watches every one of them.",
      fbTitle: "Feedback", fbHint: "Bug, idea, missing feature. A few words:",
      fbSend: "Send", fbDone: "Thanks! Sent.",
      empty: "Nothing found: change the query or filter",
      updated: "Updated ", agoNow: "just now", agoMin: " min ago", agoHour: " h ago",
      hgT100: "top 100", hgT1000: "top 1000",
      hgS100: "biggest climbs · ranks 1-100", hgS1000: "biggest climbs · ranks 101-1000",
      hgEmpty: "nothing yet",
      caption: "Europe leaderboard table with post-wipe position changes",
      tabSame: "Unchanged",
      legendAria: "What — and ≈ mean",
      showMore: "Show more",
      dataError: "Failed to load data (data.js). Refresh the page.",
      filters: "Filters",
      reset: "Reset filters",
      backTop: "Back to top",
      noDataTip: "Delta unavailable: at baseline time the player had a different nick or wasn't on the board",
      ambigTip: "Several players share this nick, matched by rank order",
      legend: "Baseline: the July 31 starting board, 14:13 GMT+3, the earliest surviving post-wipe snapshot (patch 7.41e compressed Immortal MMR to ≤9500 while preserving rank order). No earlier snapshot exists anywhere, so movement during the first ~11 hours after the patch is not counted in the deltas. \"—\": the delta couldn't be computed, on the starting board the player was listed under a different nick or was absent, and the Dota API exposes nicks only, no account IDs. \"0\": rank unchanged. \"≈\": several players share the same nick, matched by rank order.",
      locale: "en-GB"
    }
  };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var lang = store.get("lb-lang") || "ru";
  var T = I18N[lang];

  var esc = function (s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  };
  var isPhone = function () { return window.matchMedia("(max-width: 640px)").matches; };
  var fmtAgo = function (ts) { /* «обновлено 12 мин назад» понятнее, чем время слепка */
    var m = Math.max(0, Math.round((Date.now() / 1000 - ts) / 60));
    if (m < 1) return T.agoNow;
    if (m < 60) return m + T.agoMin;
    return Math.round(m / 60) + T.agoHour;
  };
  var fmtTime = function (ts) {
    return new Date(ts * 1000).toLocaleString(T.locale, { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit", timeZoneName: "short" });
  };
  var fmtNum = function (n) { return n.toLocaleString(T.locale); };

  if (!window.LB || !window.LB.players) {
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = T[el.dataset.i18n] || ""; });
    document.querySelector(".controls").style.display = "none";
    document.getElementById("stats").style.display = "none";
    document.querySelector(".side").style.display = "none";
    document.getElementById("rows").innerHTML = '<tr class="empty-row"><td colspan="3">' + T.dataError + "</td></tr>";
    return;
  }
  var players = window.LB.players;

  var FILTERS = ["all", "up", "down", "same", "new"];
  var SORTS = ["rank", "delta"];
  var MOBILE = window.matchMedia("(max-width: 640px)").matches;
  var PAGE = MOBILE ? 200 : 500, STEP = MOBILE ? 1000 : 2000;
  var limit = PAGE;

  function readHash() {
    var p = new URLSearchParams(location.hash.slice(1));
    filter = FILTERS.indexOf(p.get("f")) !== -1 ? p.get("f") : "all";
    query = (p.get("q") || "").trim();
    sortKey = SORTS.indexOf(p.get("s")) !== -1 ? p.get("s") : "rank";
    sortDir = p.get("d") === "-1" ? -1 : 1;
  }
  var filter, query, sortKey, sortDir;
  readHash();

  function syncURL() {
    var p = new URLSearchParams();
    if (filter !== "all") p.set("f", filter);
    if (query) p.set("q", query);
    if (sortKey !== "rank") p.set("s", sortKey);
    if (sortDir !== 1) p.set("d", "-1");
    var h = p.toString();
    history.replaceState(null, "", h ? "#" + h : location.pathname + location.search);
  }

  var counts = { ups: 0, downs: 0, news: 0, same: 0 };
  players.forEach(function (p) {
    if (p.d === null) counts.news++;
    else if (p.d > 0) counts.ups++;
    else if (p.d < 0) counts.downs++;
    else counts.same++;
  });

  var facts = (function () {
    var f = { climb: null, fall: null, leader: null, kept: 0 };
    players.forEach(function (p) {
      if (p.r === 1) f.leader = p;
      if (p.d === null) return;
      if (!f.climb || p.d > f.climb.d) f.climb = p;
      if (!f.fall || p.d < f.fall.d) f.fall = p;
      if (p.r <= 10 && p.r + p.d <= 10) f.kept++; /* старое место = r + d */
    });
    return f;
  })();

  var EMO = [["fire", "🔥"], ["skull", "💀"], ["clown", "🤡"], ["heart", "❤️"]];
  function factCard(type, label, value, id) {
    var picked = store.get("lb-react-" + id);
    var re = '<span class="fact-react">' + EMO.map(function (e) {
      return '<button type="button" class="re-btn' + (picked === e[0] ? " on" : "") +
        '" data-card="' + id + '" data-emo="' + e[0] + '" aria-label="' + e[1] + '">' + e[1] +
        '<span class="re-n" hidden></span></button>';
    }).join("") + "</span>";
    return '<article class="fact fact--' + type + '"><span class="fact-label">' + label +
      '</span><span class="fact-value">' + value + "</span>" + re + "</article>";
  }

  function renderDigest() {
    var el = document.getElementById("digest");
    if (!el) return;
    var c = [];
    var day = window.LB.day, nf = window.LB.nf;
    if (day && day.climb) c.push(factCard("up", T.dClimb24,
      '<span class="fact-nick">' + esc(day.climb.n) + '</span><span class="fact-delta f-up">+' + day.climb.d + "</span>", "climb24"));
    if (facts.climb) c.push(factCard("up", T.dClimb,
      '<span class="fact-nick">' + esc(facts.climb.n) + '</span><span class="fact-delta f-up">+' + facts.climb.d + "</span>", "climb"));
    var fall = nf || facts.fall;
    if (fall) c.push(factCard("down", nf ? T.dFallStar : T.dFall,
      '<span class="fact-nick">' + esc(fall.n) + '</span><span class="fact-delta f-down">−' + (-fall.d) + "</span>", "fall"));
    if (facts.leader) {
      var lv = facts.leader.d === null ? ""
        : facts.leader.d > 0 ? '<span class="fact-delta f-up">+' + facts.leader.d + "</span>"
        : facts.leader.d < 0 ? '<span class="fact-delta f-down">−' + (-facts.leader.d) + "</span>"
        : '<span class="fact-delta fact-delta--steel">0</span>';
      c.push(factCard("gold", T.dLeader,
        '<span class="fact-nick fact-nick--gold">' + esc(facts.leader.n) + "</span>" + lv, "leader"));
    }
    c.push(factCard("surv", '<span lang="en">Top 10 Survivors</span><span class="fact-label-sub">' + T.dKept + "</span>",
      '<span class="fact-delta fact-delta--surv">' + facts.kept + ' <span class="fact-of">' + T.dOf + "</span> 10</span>", "surv"));
    el.innerHTML = c.join("");
    loadReactCounts();
  }

  /* счётчики реакций: публичный эндпоинт GoatCounter, кэш на 5 минут */
  var GC = "https://141-148-232-49.sslip.io";
  var reCache = {};
  function paintCount(btn, n) {
    var s = btn.querySelector(".re-n");
    if (!s) return;
    s.textContent = n > 0 ? n : "";
    s.hidden = n <= 0;
  }
  function loadReactCounts() {
    if (!window.fetch) return;
    document.querySelectorAll("#digest .re-btn").forEach(function (b) {
      var key = "react/" + b.dataset.card + "/" + b.dataset.emo;
      if (key in reCache) { paintCount(b, reCache[key]); return; }
      var cached = store.get("lb-rc-" + key);
      if (cached) {
        var parts = cached.split(":");
        if (Date.now() - (+parts[1] || 0) < 300000) {
          reCache[key] = +parts[0];
          paintCount(b, reCache[key]);
          return;
        }
      }
      fetch(GC + "/counter/" + encodeURIComponent(key) + ".json")
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          var n = d ? parseInt(String(d.count).replace(/\D/g, ""), 10) || 0 : 0;
          reCache[key] = n;
          store.set("lb-rc-" + key, n + ":" + Date.now());
          paintCount(b, n);
        })
        .catch(function () {});
    });
  }

  function applyStatic() {
    T = I18N[lang];
    document.documentElement.lang = lang;
    document.title = T.title;
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = T[el.dataset.i18n];
    });
    var search = document.getElementById("search");
    search.placeholder = T.searchPh;
    search.setAttribute("aria-label", T.searchAria);
    document.getElementById("tabs").setAttribute("aria-label", T.filters);
    document.getElementById("lang").setAttribute("aria-label", T.langLabel);
    document.getElementById("backTop").setAttribute("aria-label", T.backTop);
    var tabNames = { all: T.tabAll, up: T.tabUp, down: T.tabDown, same: T.tabSame, "new": T.tabNew };
    var tabCounts = { all: players.length, up: counts.ups, down: counts.downs, same: counts.same, "new": counts.news };
    document.querySelectorAll(".tab").forEach(function (el) {
      el.innerHTML = tabNames[el.dataset.f] + ' <span class="tab-n">' + fmtNum(tabCounts[el.dataset.f]) + "</span>";
    });
    document.querySelector(".th-info").setAttribute("aria-label", T.legendAria);
    document.querySelectorAll(".lang-btn").forEach(function (el) {
      var active = el.dataset.l === lang;
      el.classList.toggle("active", active);
      el.setAttribute("aria-pressed", active);
    });
    document.getElementById("times").innerHTML =
      '<span class="t-base">' + esc(T.before + fmtTime(window.LB.baselineTime)) + '<span aria-hidden="true">  ·  </span></span>' +
      '<span class="t-now">' + esc(T.now + fmtTime(window.LB.currentTime)) + "</span>" +
      '<span class="t-ago">' + esc(T.updated + fmtAgo(window.LB.currentTime)) + "</span>";
    document.getElementById("stats").innerHTML =
      '<button type="button" class="kpi" data-f="all"><span class="kpi-label">' + T.players + '</span><span class="kpi-value"><span class="n" data-n="' + players.length + '">' + fmtNum(players.length) + "</span></span></button>" +
      '<button type="button" class="kpi" data-f="up"><span class="kpi-label">' + T.up + '</span><span class="kpi-value up"><span class="n" data-n="' + counts.ups + '">' + fmtNum(counts.ups) + "</span></span></button>" +
      '<button type="button" class="kpi" data-f="down"><span class="kpi-label">' + T.down + '</span><span class="kpi-value down"><span class="n" data-n="' + counts.downs + '">' + fmtNum(counts.downs) + "</span></span></button>" +
      '<button type="button" class="kpi" data-f="same"><span class="kpi-label">' + T.same + '</span><span class="kpi-value"><span class="n" data-n="' + counts.same + '">' + fmtNum(counts.same) + "</span></span></button>" +
      '<button type="button" class="kpi" data-f="new"><span class="kpi-label">' + T.newPlayers + '</span><span class="kpi-value"><span class="n" data-n="' + counts.news + '">' + fmtNum(counts.news) + "</span></span></button>";
    renderDigest();
    syncActive();
  }

  function syncActive() {
    document.querySelectorAll(".tab, .kpi").forEach(function (el) {
      var active = el.dataset.f === filter &&
        !(filter === "all" && el.classList.contains("kpi"));
      el.classList.toggle("active", active);
      el.setAttribute("aria-pressed", active);
    });
    var a = document.querySelector(".tab.active");
    if (a && a.parentNode.scrollWidth > a.parentNode.clientWidth) {
      a.parentNode.scrollLeft = Math.max(0, a.offsetLeft - 12);
    }
  }

  function setFilter(f) {
    filter = f;
    limit = PAGE;
    syncActive();
    syncURL();
    render();
  }

  var reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function countUp() {
    if (reducedMotion) return;
    var nodes = document.querySelectorAll(".kpi-value .n");
    var t0 = null, dur = 900;
    function tick(ts) {
      if (!t0) t0 = ts;
      var k = Math.min(1, (ts - t0) / dur);
      var e = 1 - Math.pow(1 - k, 3);
      nodes.forEach(function (el) {
        el.textContent = fmtNum(Math.round(e * +el.dataset.n));
      });
      if (k < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  /* click popup for — and ≈ */
  var tipEl = document.createElement("div");
  tipEl.className = "tip-pop";
  tipEl.id = "tip-pop";
  tipEl.setAttribute("role", "note");
  document.body.appendChild(tipEl);
  var tipOpenFor = null;

  function positionTip(target) {
    var r = target.getBoundingClientRect();
    var w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    var maxX = window.scrollX + document.documentElement.clientWidth - w - 8;
    var below = r.bottom + h + 16 <= window.innerHeight || r.top < h + 16;
    tipEl.style.left = Math.max(window.scrollX + 8, Math.min(r.left + window.scrollX, maxX)) + "px";
    tipEl.style.top = (below ? r.bottom + window.scrollY + 8 : r.top + window.scrollY - h - 8) + "px";
  }

  function showTip(target) {
    hideTip();
    var key = target.dataset.tip;
    tipEl.textContent = key === "ambig" ? T.ambigTip : key === "legend" ? T.legend : T.noDataTip;
    if (target.hasAttribute("aria-controls")) {
      target.setAttribute("aria-expanded", "true");
      target.setAttribute("aria-describedby", "tip-pop");
    }
    tipEl.style.left = "0px";
    tipEl.style.top = "0px";
    tipEl.classList.add("show");
    positionTip(target);
    tipOpenFor = target;
  }
  function hideTip() {
    if (!tipOpenFor) return;
    if (tipOpenFor.hasAttribute("aria-controls")) {
      tipOpenFor.setAttribute("aria-expanded", "false");
      tipOpenFor.removeAttribute("aria-describedby");
    }
    tipEl.classList.remove("show");
    tipOpenFor = null;
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-tip]");
    if (t) { tipOpenFor === t ? hideTip() : showTip(t); }
    else if (!e.target.closest(".tip-pop")) hideTip();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && tipOpenFor) {
      var trigger = tipOpenFor;
      hideTip();
      if (trigger.focus) trigger.focus();
    }
    if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.tip) {
      e.preventDefault();
      tipOpenFor === e.target ? hideTip() : showTip(e.target);
    }
  });
  window.addEventListener("scroll", function () {
    if (tipOpenFor) positionTip(tipOpenFor);
  }, { passive: true });
  window.addEventListener("resize", hideTip);

  var deltaCell = function (p) {
    var amb = p.a ? ' <span class="ambig" data-tip="ambig" aria-label="≈: ' + esc(T.ambigTip) + '">≈</span>' : "";
    if (p.d === null) return '<span class="d-nodata" data-tip="nodata" aria-label="' + esc(T.noDataTip) + '">—</span>';
    if (p.d > 0) return '<span class="d-up">+' + p.d + "</span>" + amb;
    if (p.d < 0) return '<span class="d-down">−' + (-p.d) + "</span>" + amb;
    return '<span class="d-zero">0</span>' + amb;
  };
  var flagCell = function (c) {
    if (!c) return '<span class="noflag"></span>';
    return '<img class="flag" loading="lazy" src="flags/' + c + '.png" alt="" onerror="this.outerHTML=\'<span class=noflag></span>\'">';
  };

  var rowsEl = document.getElementById("rows");
  var noteEl = document.getElementById("note");

  function renderSide() {
    [["hg100", 1, 100], ["hg1000", 101, 1000]].forEach(function (spec) {
      var top = players
        .filter(function (p) { return p.d !== null && p.d > 0 && p.r >= spec[1] && p.r <= spec[2]; })
        .sort(function (a, b) { return b.d - a.d; })
        .slice(0, 5);
      document.getElementById(spec[0]).innerHTML = top.length
        ? top.map(function (p) {
            return '<button type="button" class="hg-row" data-n="' + esc(p.n) + '"><span class="hg-rank">#' + p.r + "</span>" +
              '<span class="hg-name">' + flagCell(p.c) + esc(p.n) + "</span>" +
              '<span class="hg-delta">+' + p.d + "</span></button>";
          }).join("")
        : '<div class="hg-empty">' + T.hgEmpty + "</div>";
    });
  }

  function sortedPlayers() {
    if (sortKey === "delta") {
      return players.slice().sort(function (a, b) {
        if (a.d === null && b.d === null) return a.r - b.r;
        if (a.d === null) return 1;
        if (b.d === null) return -1;
        return sortDir * (b.d - a.d) || a.r - b.r;
      });
    }
    return sortDir === 1 ? players : players.slice().reverse();
  }

  function updateSortUI() {
    document.querySelectorAll(".th-sort").forEach(function (th) {
      var active = th.dataset.sort === sortKey;
      var desc = sortKey === "delta" ? sortDir === 1 : sortDir === -1;
      th.setAttribute("aria-sort", active ? (desc ? "descending" : "ascending") : "none");
      th.querySelector(".dir").textContent = active ? (desc ? "↓" : "↑") : "";
    });
  }

  function matchedPlayers() {
    var q = query.toLowerCase();
    return sortedPlayers().filter(function (p) {
      if (filter === "up" && !(p.d !== null && p.d > 0)) return false;
      if (filter === "down" && !(p.d !== null && p.d < 0)) return false;
      if (filter === "same" && p.d !== 0) return false;
      if (filter === "new" && p.d !== null) return false;
      if (q && p.n.toLowerCase().indexOf(q) === -1 && (p.t || "").toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  function rowHTML(p) {
    return "<tr" + (p.r <= 3 ? " class='top3'" : "") + "><td class='col-rank'>" + p.r + "</td><td class='col-delta'>" + deltaCell(p) +
      "</td><td>" + flagCell(p.c) + "<span class='name'>" + esc(p.n) + "</span>" +
      (p.t ? "<span class='team'>" + esc(p.t) + "</span>" : "") + "</td></tr>";
  }

  function moreRowHTML(rest) {
    return '<tr class="more-row"><td colspan="3"><button type="button" class="more-btn">' +
      T.showMore + " (" + fmtNum(Math.min(STEP, rest)) + ")</button></td></tr>";
  }

  function updateNote(matches) {
    noteEl.hidden = filter === "all" && !query;
    noteEl.textContent = T.found + fmtNum(matches) + T.of + fmtNum(players.length) +
      (matches > limit ? T.shownPart + fmtNum(limit) : "");
  }

  function render() {
    hideTip();
    var m = matchedPlayers();
    var html = m.slice(0, limit).map(rowHTML);
    var rest = m.length - Math.min(m.length, limit);
    if (rest > 0) html.push(moreRowHTML(rest));
    rowsEl.innerHTML = html.length
      ? html.join("")
      : '<tr class="empty-row"><td colspan="3">' + T.empty + '<button type="button" class="reset-btn">' + T.reset + "</button></td></tr>";
    updateNote(m.length);
  }

  function appendMore() {
    var m = matchedPlayers();
    var start = limit;
    limit += STEP;
    var moreRow = rowsEl.querySelector(".more-row");
    if (moreRow) moreRow.remove();
    rowsEl.insertAdjacentHTML("beforeend", m.slice(start, limit).map(rowHTML).join(""));
    var rest = m.length - Math.min(m.length, limit);
    if (rest > 0) rowsEl.insertAdjacentHTML("beforeend", moreRowHTML(rest));
    updateNote(m.length);
    var btn = rowsEl.querySelector(".more-btn");
    if (btn) btn.focus({ preventScroll: true }); /* без preventScroll браузер уносит в конец списка */
    else {
      rowsEl.setAttribute("tabindex", "-1");
      rowsEl.focus();
    }
  }

  var searchTimer;
  document.getElementById("search").addEventListener("input", function (e) {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      query = e.target.value.trim();
      limit = PAGE;
      syncURL();
      render();
    }, 150);
  });
  document.getElementById("tabs").addEventListener("click", function (e) {
    var t = e.target.closest(".tab");
    if (t) setFilter(t.dataset.f);
  });
  document.getElementById("stats").addEventListener("click", function (e) {
    var k = e.target.closest(".kpi");
    if (k) setFilter(k.dataset.f);
  });
  document.querySelector("thead").addEventListener("click", function (e) {
    if (e.target.closest(".th-info")) return;
    var th = e.target.closest(".th-sort");
    if (!th) return;
    if (sortKey === th.dataset.sort) sortDir = -sortDir;
    else {
      sortKey = th.dataset.sort;
      sortDir = sortKey === "delta" && filter === "down" ? -1 : 1;
    }
    limit = PAGE;
    updateSortUI();
    syncURL();
    render();
  });
  rowsEl.addEventListener("click", function (e) {
    if (e.target.closest(".more-btn")) {
      appendMore();
      return;
    }
    if (e.target.closest(".reset-btn")) {
      query = "";
      var s = document.getElementById("search");
      s.value = "";
      setFilter("all");
      if (!isPhone()) s.focus(); /* на телефоне фокус поднимает клавиатуру поверх результата */
    }
  });
  document.querySelector(".side").addEventListener("click", function (e) {
    var row = e.target.closest(".hg-row");
    if (!row) return;
    var s = document.getElementById("search");
    s.value = row.dataset.n;
    query = row.dataset.n;
    setFilter("all");
    if (isPhone()) document.getElementById("board").scrollIntoView({ block: "start" });
    else s.focus();
  });
  window.addEventListener("hashchange", function () {
    readHash();
    document.getElementById("search").value = query;
    limit = PAGE;
    syncActive();
    updateSortUI();
    render();
  });
  var backTop = document.getElementById("backTop");
  window.addEventListener("scroll", function () {
    backTop.classList.toggle("show", window.scrollY > 600);
  }, { passive: true });
  backTop.addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: reducedMotion ? "auto" : "smooth" });
  });
  document.getElementById("lang").addEventListener("click", function (e) {
    var b = e.target.closest(".lang-btn");
    if (!b || b.dataset.l === lang) return;
    lang = b.dataset.l;
    store.set("lb-lang", lang);
    applyStatic();
    renderSide();
    render();
  });

  /* эмодзи-реакции на карточках сводки → событие в аналитику */
  document.getElementById("digest").addEventListener("click", function (ev) {
    var b = ev.target.closest(".re-btn");
    if (!b) return;
    var was = b.classList.contains("on");
    b.parentNode.querySelectorAll(".re-btn").forEach(function (x) { x.classList.remove("on"); });
    store.set("lb-react-" + b.dataset.card, was ? "" : b.dataset.emo);
    if (!was) {
      b.classList.add("on");
      var k = "react/" + b.dataset.card + "/" + b.dataset.emo; /* сразу рисуем свой голос */
      reCache[k] = (reCache[k] || 0) + 1;
      store.set("lb-rc-" + k, reCache[k] + ":" + Date.now());
      paintCount(b, reCache[k]);
      if (window.gtag) gtag("event", "react", { card: b.dataset.card, emoji: b.dataset.emo });
      if (window.goatcounter && goatcounter.count) goatcounter.count({
        path: "react/" + b.dataset.card + "/" + b.dataset.emo, title: "Реакция", event: true });
    }
  });

  /* гриндеры: на десктопе всегда раскрыты, на мобиле — аккордеоны (свернуты) */
  var accMq = window.matchMedia("(max-width: 980px)");
  function accSync() {
    document.querySelectorAll(".side details").forEach(function (d) { d.open = !accMq.matches; });
  }
  accSync();
  document.body.classList.add("acc-ready");
  if (accMq.addEventListener) accMq.addEventListener("change", accSync);

  /* эпиграф на телефоне свёрнут до двух строк, тап разворачивает */
  (function () {
    var ep = document.querySelector(".hero-epigraph");
    if (!ep) return;
    ep.setAttribute("tabindex", "0");
    var toggle = function () { if (isPhone()) ep.classList.toggle("open"); };
    ep.addEventListener("click", toggle);
    ep.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    });
  })();

  /* обратная связь: попап → событие в аналитику */
  (function () {
    var ov = document.getElementById("fbOverlay"), tx = document.getElementById("fbText"),
        done = document.getElementById("fbDone");
    function openFb(ev) { if (ev) ev.preventDefault(); ov.hidden = false; done.hidden = true; tx.focus(); }
    function closeFb() { ov.hidden = true; }
    document.getElementById("fbOpen").addEventListener("click", openFb);
    document.getElementById("fbClose").addEventListener("click", closeFb);
    ov.addEventListener("click", function (ev) { if (ev.target === ov) closeFb(); });
    document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && !ov.hidden) closeFb(); });
    document.getElementById("fbSend").addEventListener("click", function () {
      var msg = tx.value.trim();
      if (!msg) { tx.focus(); return; }
      if (window.gtag) gtag("event", "feedback", {
        fb_1: msg.slice(0, 100), fb_2: msg.slice(100, 200), fb_3: msg.slice(200, 300),
        fb_len: msg.length, ui_lang: lang
      });
      /* GoatCounter пишет текст в path (лимит ~1000 симв) — так отзыв виден прямо в дашборде */
      if (window.goatcounter && goatcounter.count) goatcounter.count({
        path: "feedback/" + msg.slice(0, 200).replace(/[\r\n]+/g, " "), title: "Отзыв", event: true });
      tx.value = "";
      done.hidden = false;
      setTimeout(closeFb, 1400);
    });
  })();

  if (query) document.getElementById("search").value = query;
  applyStatic();
  updateSortUI();
  renderSide();
  render();
  setTimeout(countUp, 350);
  setTimeout(function () { document.body.classList.add("settled"); }, 1400);
})();
</script>
</body>
</html>
