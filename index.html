    src: url(fonts/oswald-cyrillic-500.woff2) format("woff2");

  @font-face { font-family: "Oswald"; font-style: normal; font-weight: 500; font-display: swap;
    src: url(fonts/oswald-latin-500.woff2) format("woff2");

  @font-face { font-family: "Oswald"; font-style: normal; font-weight: 600; font-display: swap;
    src: url(fonts/oswald-cyrillic-600.woff2) format("woff2");
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: "Oswald"; font-style: normal; font-weight: 600; font-display: swap;
    src: url(fonts/oswald-latin-600.woff2) format("woff2");

    src: url(fonts/inter-cyrillic-400.woff2) format("woff2");
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 400; font-display: swap;
    src: url(fonts/inter-latin-400.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD; }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 500; font-display: swap;
    src: url(fonts/inter-cyrillic-500.woff2) format("woff2");
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 500; font-display: swap;
    src: url(fonts/inter-latin-500.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD; }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 700; font-display: swap;
    src: url(fonts/inter-cyrillic-700.woff2) format("woff2");
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 700; font-display: swap;
    src: url(fonts/inter-latin-700.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD; }

  :root {
    /* surfaces */
    --bg: #0c0f14;
    --panel: #141a22;
    --panel-2: #161c25;
    --row: #12171f;
    --row-alt: #0f131a;
    --row-hover: #1d242e;
    --line: #232b36;
    /* ink */
    --ink: #eaeff6;
    --steel: #9aa8ba;
    --dim: #8093a8;
    /* accents */
    --ember: #c8402f;
    --ember-hi: #e05a41;
    --ember-deep: #8f2a1e;
    --up: #6ec888;
    --down: #f2766b;
    --gold: #e6b45c;
    --ring: #ecc069;
    /* type */
    --display: "Oswald", "Arial Narrow", Arial, sans-serif;
    --body: "Inter", "Segoe UI", Tahoma, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-padding-top: 48px; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 14px/1.5 var(--body);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--ember-deep); color: #fff; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  .wrap { max-width: 1264px; margin: 0 auto; padding: 0 16px; }

  /* ── two-column layout: board + side panel ──────────── */
  .layout {
    display: grid; grid-template-columns: minmax(0, 1fr) 280px;
    gap: 24px; align-items: start;
  }
  .side { display: grid; gap: 16px; position: sticky; top: 16px; }
  .side-card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px;
  }
  .side-title {
    font: 500 14px/1.2 var(--display); text-transform: uppercase;
    letter-spacing: .1em; color: var(--ink);
  }
  .side-title .hl { color: var(--ember-hi); }
  .side-sub { color: var(--dim); font-size: 11px; margin-top: 4px; }
  .hg-list { margin-top: 10px; }
  .hg-row {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 0; font-size: 13px;
  }
  .hg-row + .hg-row { border-top: 1px solid var(--line); }
  .hg-rank {
    color: var(--steel); font: 500 14px/1 var(--display);
    min-width: 44px; font-variant-numeric: tabular-nums;
  }
  .hg-name {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-weight: 500;
  }
  .hg-delta { color: var(--up); font-weight: 700; font-variant-numeric: tabular-nums; }
  .hg-empty { color: var(--dim); font-size: 12px; padding: 8px 0; }
  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
    .side {
      position: static;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }
  }

  /* ── topbar ─────────────────────────────────────────── */
  .topbar {
    background: linear-gradient(180deg, #271012 0%, #14090a 100%);
    border-bottom: 2px solid var(--ember);
  }
  .topbar .wrap {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; min-height: 56px;
  }
  .logo {
    font: 600 20px/1 var(--display);
    letter-spacing: .24em; text-transform: uppercase;
    color: #f2efec; white-space: nowrap;
  }
  .logo span { color: var(--ember-hi); }

  /* language switcher */
  .lang {
    display: flex; gap: 2px; padding: 2px;
    background: rgba(0,0,0,.35);
    border: 1px solid #43201d; border-radius: 6px;
  }
  .lang-btn {
    appearance: none; border: 0; background: transparent;
    font: 700 11px/1 var(--body); letter-spacing: .1em;
    color: var(--steel); padding: 7px 11px; border-radius: 4px;
    cursor: pointer;
    transition: color .12s ease, background-color .12s ease;
  }
  .lang-btn:hover { color: var(--ink); background: rgba(255,255,255,.06); }
  .lang-btn.active { background: var(--ember-deep); color: #fff; }
  .lang-btn.active:hover { background: #a03325; }
  .lang-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }

  /* ── site hero ──────────────────────────────────────── */
  .hero { padding: 52px 16px 4px; text-align: center; }
  .hero-title {
    font: 600 clamp(44px, 9vw, 92px)/1 var(--display);
    text-transform: uppercase; letter-spacing: .06em; color: #f2efec;
    text-shadow: 0 0 56px rgba(200, 64, 47, .38);
  }
  .hero-title .fall { color: var(--ember-hi); }
  .hero-sub { color: var(--steel); margin-top: 12px; font-size: 14px; letter-spacing: .02em; }

  /* ── page header ────────────────────────────────────── */
  header.page { padding: 32px 0 0; position: relative; }
  header.page::before {
    content: ""; position: absolute; top: -56px; left: -120px;
    width: 560px; height: 260px; pointer-events: none;
    background: radial-gradient(closest-side, rgba(200, 64, 47, .13), transparent);
  }
  .h1-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 {
    font: 600 clamp(30px, 6vw, 44px)/1.05 var(--display);
    text-transform: uppercase; letter-spacing: .015em;
    border-left: 4px solid var(--ember); padding-left: 16px;
  }
  .wipe-chip {
    font: 600 13px/1 var(--display); letter-spacing: .14em; text-transform: uppercase;
    color: var(--gold); border: 1px solid #64512a; border-radius: 6px;
    background: rgba(230, 180, 92, .08); padding: 8px 12px; white-space: nowrap;
  }
  .sub {
    color: var(--steel); margin: 8px 0 0 20px; font-size: 13px;
    font-variant-numeric: tabular-nums;
  }

  /* ── KPI tiles ──────────────────────────────────────── */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px; margin-top: 24px;
  }
  .kpi {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 16px;
  }
  .kpi-label {
    display: block; font: 700 11px/1.2 var(--body);
    text-transform: uppercase; letter-spacing: .09em;
    color: var(--steel); margin-bottom: 8px;
  }
  .kpi-value {
    display: block; font: 600 26px/1 var(--display);
    color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .kpi-value.up { color: var(--up); }
  .kpi-value.down { color: var(--down); }
  .kpi-value.new { color: var(--gold); }

  /* ── controls ───────────────────────────────────────── */
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 24px 0 8px; }
  .search {
    flex: 1 1 240px; height: 40px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    color: var(--ink); padding: 0 14px; font: 400 14px var(--body);
  }
  .search::placeholder { color: var(--dim); }
  .search:hover { border-color: #34404f; }
  .search:focus-visible { outline: 2px solid var(--ring); outline-offset: 0; border-color: transparent; }
  .tabs {
    display: flex; gap: 4px; padding: 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  }
  .tab {
    appearance: none; border: 0; background: transparent;
    font: 500 13px/32px var(--display); text-transform: uppercase; letter-spacing: .06em;
    color: var(--steel); padding: 0 14px; border-radius: 4px;
    cursor: pointer; user-select: none; white-space: nowrap;
    transition: color .12s ease, background-color .12s ease;
  }
  .tab:hover { color: var(--ink); background: var(--row-hover); }
  .tab.active { background: var(--ember-deep); color: #fff; }
  .tab:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }

  .count-note {
    color: var(--dim); font-size: 12px; margin: 0 0 8px 4px;
    font-variant-numeric: tabular-nums;
  }

  /* ── board / table ──────────────────────────────────── */
  .board {
    border: 1px solid var(--line); border-radius: 10px;
    overflow: clip; margin-bottom: 24px;
  }
  table { width: 100%; border-collapse: separate; border-spacing: 0; }
  thead th {
    position: sticky; top: 0; z-index: 1;
    background: var(--panel-2);
    text-align: left; font: 500 12px/1 var(--display);
    text-transform: uppercase; letter-spacing: .14em;
    color: var(--steel); padding: 13px 16px;
    border-bottom: 2px solid var(--ember-deep);
  }
  tbody td { padding: 10px 16px; }
  tbody tr:nth-child(odd) { background: var(--row); }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); }
  .col-rank {
    width: 72px; font: 500 16px/1.3 var(--display);
    color: var(--steel); font-variant-numeric: tabular-nums;
  }
  .col-delta {
    width: 112px; font-weight: 700; font-size: 13px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .d-up { color: var(--up); }
  .d-down { color: var(--down); }
  .d-zero { color: var(--dim); font-weight: 400; }
  .d-nodata {
    color: var(--dim); font-weight: 400; cursor: pointer;
    border-bottom: 1px dotted var(--dim);
    transition: color .12s ease, border-color .12s ease;
  }
  .ambig {
    color: var(--dim); font-weight: 400; cursor: pointer;
    border-bottom: 1px dotted var(--dim);
    transition: color .12s ease, border-color .12s ease;
  }
  .d-nodata:hover, .ambig:hover { color: var(--steel); border-color: var(--steel); }

  /* ── click popup for — and ≈ ────────────────────────── */
  .tip-pop {
    position: absolute; z-index: 50; max-width: 300px;
    background: #1a222d; border: 1px solid #34404f; border-left: 3px solid var(--gold);
    border-radius: 8px; padding: 12px 14px;
    color: var(--ink); font-size: 12.5px; line-height: 1.55;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .5);
    opacity: 0; transform: translateY(6px) scale(.97);
    transition: opacity .16s ease, transform .16s cubic-bezier(.2, .7, .3, 1);
    pointer-events: none;
  }
  .tip-pop.show { opacity: 1; transform: none; pointer-events: auto; }
  .flag { width: 16px; height: 12px; margin-right: 8px; vertical-align: -1px; border-radius: 2px; }
  .noflag { display: inline-block; width: 16px; margin-right: 8px; }
  .name { color: var(--ink); font-weight: 500; }
  .team { color: var(--steel); font-size: 12px; margin-left: 8px; }
  .empty-row td { padding: 32px 16px; text-align: center; color: var(--dim); }

  .footer {
    color: var(--dim); font-size: 12px; line-height: 1.7;
    max-width: 760px; padding: 0 0 48px;
  }

  /* ── load animations & micro-interactions ───────────── */
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }
  .hero-title { animation: rise .6s cubic-bezier(.2, .7, .3, 1) both; }
  .hero-sub { animation: rise .6s .1s cubic-bezier(.2, .7, .3, 1) both; }
  .h1-row, .sub { animation: rise .5s .18s cubic-bezier(.2, .7, .3, 1) both; }
  .kpi { animation: rise .5s cubic-bezier(.2, .7, .3, 1) both; }
  .kpi:nth-child(1) { animation-delay: .26s; }
  .kpi:nth-child(2) { animation-delay: .32s; }
  .kpi:nth-child(3) { animation-delay: .38s; }
  .kpi:nth-child(4) { animation-delay: .44s; }
  .kpi:nth-child(5) { animation-delay: .5s; }
  .controls, .count-note { animation: rise .5s .42s cubic-bezier(.2, .7, .3, 1) both; }
  .board { animation: rise .55s .5s cubic-bezier(.2, .7, .3, 1) both; }
  .side-card { animation: rise .55s cubic-bezier(.2, .7, .3, 1) both; }
  .side-card:nth-child(1) { animation-delay: .58s; }
  .side-card:nth-child(2) { animation-delay: .66s; }
  .kpi { transition: border-color .15s ease; }
  .kpi:hover { border-color: #34404f; }
  .hg-row { transition: background-color .12s ease; }
  .hg-row:hover { background: rgba(255, 255, 255, .03); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ── narrow screens ─────────────────────────────────── */
  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); }
    .kpi { padding: 10px 12px; }
    .kpi-value { font-size: 22px; }
    .tabs { flex: 1 1 100%; }
    .tab { flex: 1 1 auto; padding: 0 8px; font-size: 12px; text-align: center; }
  }
  @media (max-width: 460px) {
    .wrap { padding: 0 12px; }
    .logo { letter-spacing: .14em; font-size: 18px; }
    header.page { padding-top: 24px; }
    thead th, tbody td { padding-left: 10px; padding-right: 10px; }
    .col-rank { width: 48px; }
    .col-delta { width: 84px; }
    .team { display: block; margin: 2px 0 0 24px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="wrap">
      <div class="logo">Dota <span>2</span> · Leaderboards</div>
      <div class="lang" id="lang">
        <button class="lang-btn" data-l="ru">RU</button>
        <button class="lang-btn" data-l="en">EN</button>
      </div>
    </div>
  </div>
  <div class="hero">
    <div class="hero-title">After the <span class="fall">Fall</span></div>
    <div class="hero-sub" data-i18n="heroSub"></div>
  </div>
  <div class="wrap">
    <header class="page">
      <div class="h1-row">
        <h1 data-i18n="h1"></h1>

        <button type="button" class="tab" data-f="down"></button>

      </div>
    </div>
    <div class="count-note" id="note" aria-live="polite"></div>
    <div class="layout">
      <div class="board">
        <table>
          <thead><tr>
            <th class="col-rank" data-i18n="thRank"></th>
            <th class="col-delta" data-i18n="thChg"></th>
            <th data-i18n="thPlayer"></th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <aside class="side">
        <div class="side-card">
          <div class="side-title">High <span class="hl">Grinders</span> · <span data-i18n="hgT100"></span></div>
          <div class="side-sub" data-i18n="hgS100"></div>
          <div class="hg-list" id="hg100"></div>
        </div>
        <div class="side-card">
          <div class="side-title">High <span class="hl">Grinders</span> · <span data-i18n="hgT1000"></span></div>
          <div class="side-sub" data-i18n="hgS1000"></div>
          <div class="hg-list" id="hg1000"></div>
        </div>
      </aside>
    </div>
    <div class="footer" data-i18n="legend"></div>
  </div>
<script src="data.js"></script>

      noDataTip: "Delta unavailable: at baseline time the player had a different nick or wasn't on the board",
      ambigTip: "Several players share this nick — matched by rank order",
      legend: "\"—\" — the delta couldn't be computed: on the baseline board (July 31, pre-wipe) the player was listed under a different nick or was absent, and the Dota API exposes nicks only, no account IDs, so renames can't be matched. \"0\" — rank unchanged. \"≈\" — several players share the same nick; matched by rank order.",
      locale: "en-GB"
    }
  };
  var lang = localStorage.getItem("lb-lang") || "ru";
  var T = I18N[lang];

  var esc = function (s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  };
  var fmtTime = function (ts) {
    return new Date(ts * 1000).toLocaleString(T.locale, { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
  };
  var fmtNum = function (n) { return n.toLocaleString(T.locale); };
  var players = window.LB.players;
  var filter = "all", query = "";

  var counts = { ups: 0, downs: 0, news: 0, same: 0 };
  players.forEach(function (p) {
    if (p.d === null) counts.news++;
    else if (p.d > 0) counts.ups++;
    else if (p.d < 0) counts.downs++;
    else counts.same++;
  });

  function applyStatic() {
    T = I18N[lang];
    document.documentElement.lang = lang;
    document.title = T.title;
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = T[el.dataset.i18n];
    });
    var search = document.getElementById("search");
    search.placeholder = T.searchPh;
    search.setAttribute("aria-label", T.searchAria);
    var tabNames = { all: T.tabAll, up: T.tabUp, down: T.tabDown, "new": T.tabNew };
    document.querySelectorAll(".tab").forEach(function (el) { el.textContent = tabNames[el.dataset.f]; });
    document.querySelectorAll(".lang-btn").forEach(function (el) {
      el.classList.toggle("active", el.dataset.l === lang);
    });
    document.getElementById("times").textContent =
      T.before + fmtTime(window.LB.baselineTime) + T.now + fmtTime(window.LB.currentTime);
    document.getElementById("stats").innerHTML =
      '<div class="kpi"><span class="kpi-label">' + T.players + '</span><span class="kpi-value"><span class="n" data-n="' + players.length + '">' + fmtNum(players.length) + "</span></span></div>" +
      '<div class="kpi"><span class="kpi-label">' + T.up + '</span><span class="kpi-value up">▲ <span class="n" data-n="' + counts.ups + '">' + fmtNum(counts.ups) + "</span></span></div>" +
      '<div class="kpi"><span class="kpi-label">' + T.down + '</span><span class="kpi-value down">▼ <span class="n" data-n="' + counts.downs + '">' + fmtNum(counts.downs) + "</span></span></div>" +
      '<div class="kpi"><span class="kpi-label">' + T.same + '</span><span class="kpi-value"><span class="n" data-n="' + counts.same + '">' + fmtNum(counts.same) + "</span></span></div>" +
      '<div class="kpi"><span class="kpi-label">' + T.newPlayers + '</span><span class="kpi-value"><span class="n" data-n="' + counts.news + '">' + fmtNum(counts.news) + "</span></span></div>";
  }

  var reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function countUp() {
    if (reducedMotion) return;
    var nodes = document.querySelectorAll(".kpi-value .n");
    var t0 = null, dur = 900;
    function tick(ts) {
      if (!t0) t0 = ts;
      var k = Math.min(1, (ts - t0) / dur);
      var e = 1 - Math.pow(1 - k, 3);
      nodes.forEach(function (el) {
        el.textContent = fmtNum(Math.round(e * +el.dataset.n));
      });
      if (k < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  /* click popup for — and ≈ */
  var tipEl = document.createElement("div");
  tipEl.className = "tip-pop";
  tipEl.setAttribute("role", "tooltip");
  document.body.appendChild(tipEl);
  var tipOpenFor = null;

  function showTip(target) {
    tipEl.textContent = target.dataset.tip === "ambig" ? T.ambigTip : T.noDataTip;
    tipEl.style.left = "0px";
    tipEl.style.top = "0px";
    tipEl.classList.add("show");
    var r = target.getBoundingClientRect();
    var w = tipEl.offsetWidth;
    var maxX = window.scrollX + document.documentElement.clientWidth - w - 8;
    tipEl.style.left = Math.max(8, Math.min(r.left + window.scrollX, maxX)) + "px";
    tipEl.style.top = (r.bottom + window.scrollY + 8) + "px";
    tipOpenFor = target;
  }
  function hideTip() {
    if (!tipOpenFor) return;
    tipEl.classList.remove("show");
    tipOpenFor = null;
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-tip]");
    if (t) { tipOpenFor === t ? hideTip() : showTip(t); }
    else if (!e.target.closest(".tip-pop")) hideTip();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") hideTip();
    if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.tip) {
      e.preventDefault();
      tipOpenFor === e.target ? hideTip() : showTip(e.target);
    }
  });
  window.addEventListener("scroll", hideTip, { passive: true });
  window.addEventListener("resize", hideTip);

  var deltaCell = function (p) {
    var amb = p.a ? ' <span class="ambig" data-tip="ambig" role="button" tabindex="0">≈</span>' : "";
    if (p.d === null) return '<span class="d-nodata" data-tip="nodata" role="button" tabindex="0">—</span>';
    if (p.d > 0) return '<span class="d-up">▲ ' + p.d + "</span>" + amb;
    if (p.d < 0) return '<span class="d-down">▼ ' + (-p.d) + "</span>" + amb;
    return '<span class="d-zero">0</span>' + amb;
  };
  var flagCell = function (c) {
    if (!c) return '<span class="noflag"></span>';
    return '<img class="flag" loading="lazy" src="https://flagcdn.com/16x12/' + c + '.png" alt="" onerror="this.outerHTML=\'<span class=noflag></span>\'">';
  };

  var rowsEl = document.getElementById("rows");
  var noteEl = document.getElementById("note");

  function renderSide() {
    [["hg100", 1, 100], ["hg1000", 101, 1000]].forEach(function (spec) {
      var top = players
        .filter(function (p) { return p.d !== null && p.d > 0 && p.r >= spec[1] && p.r <= spec[2]; })
        .sort(function (a, b) { return b.d - a.d; })
        .slice(0, 5);
      document.getElementById(spec[0]).innerHTML = top.length
        ? top.map(function (p) {
            return '<div class="hg-row"><span class="hg-rank">#' + p.r + "</span>" +
              '<span class="hg-name">' + flagCell(p.c) + esc(p.n) + "</span>" +
              '<span class="hg-delta">▲ ' + p.d + "</span></div>";
          }).join("")
        : '<div class="hg-empty">' + T.hgEmpty + "</div>";
    });
  }

  function render() {
    hideTip();
    var q = query.toLowerCase();
    var html = [];
    var shown = 0;
    for (var i = 0; i < players.length; i++) {
      var p = players[i];
      if (filter === "up" && !(p.d !== null && p.d > 0)) continue;
      if (filter === "down" && !(p.d !== null && p.d < 0)) continue;
      if (filter === "new" && p.d !== null) continue;
      if (q && p.n.toLowerCase().indexOf(q) === -1 && (p.t || "").toLowerCase().indexOf(q) === -1) continue;
      shown++;
      html.push(
        "<tr><td class='col-rank'>" + p.r + "</td><td class='col-delta'>" + deltaCell(p) +
        "</td><td>" + flagCell(p.c) + "<span class='name'>" + esc(p.n) + "</span>" +
        (p.t ? "<span class='team'>" + esc(p.t) + "</span>" : "") + "</td></tr>"
      );
    }
    rowsEl.innerHTML = html.length
      ? html.join("")
      : '<tr class="empty-row"><td colspan="3">' + T.empty + "</td></tr>";
    noteEl.textContent = T.shown + fmtNum(shown) + T.of + fmtNum(players.length);
  }

  document.getElementById("search").addEventListener("input", function (e) {
    query = e.target.value.trim();
    render();
  });
  document.getElementById("tabs").addEventListener("click", function (e) {
    var t = e.target.closest(".tab");
    if (!t) return;
    document.querySelectorAll(".tab").forEach(function (el) { el.classList.remove("active"); });
    t.classList.add("active");
    filter = t.dataset.f;
    render();
  });
  document.getElementById("lang").addEventListener("click", function (e) {
    var b = e.target.closest(".lang-btn");
    if (!b || b.dataset.l === lang) return;
    lang = b.dataset.l;
    localStorage.setItem("lb-lang", lang);
    applyStatic();
    renderSide();
    render();
  });

  applyStatic();
  renderSide();
  render();
  countUp();
})();
</script>
</body>
</html>
